<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Perception Study</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#5d6678;--line:#d9dde5;--accent:#2f5fd0;--accent-ink:#fff;--bad:#c0392b;--sel:#e6edfc}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali","Noto Sans Devanagari",Arial,sans-serif}
  main{max-width:720px;margin:0 auto;padding:16px}
  h1{font-size:1.35rem;margin:.2em 0 .6em} h2{font-size:1.1rem;margin:1.2em 0 .4em}
  .panel,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
  .card.bad{border-color:var(--bad);box-shadow:0 0 0 2px rgba(192,57,43,.15)}
  label{display:block;font-weight:600;margin:12px 0 4px} .opt{font-weight:400;color:var(--mute)}
  select,input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:1rem;background:#fff}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:600}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .note{color:var(--mute);font-size:.92rem} .err{color:var(--bad);font-weight:600;margin-top:10px}
  .demo{background:#fff4d6;border:1px solid #e8cf80;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.9rem}
  .bar{height:8px;background:#e3e7ee;border-radius:99px;overflow:hidden;margin:6px 0 14px}.bar>i{display:block;height:100%;background:var(--accent)}
  .scene{background:#f3f5f9;border-radius:8px;padding:12px;margin:8px 0 12px}
  .scene b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
  .item-text{font-size:1.08rem}
  .item-text.bn{font-family:"Noto Sans Bengali","Kalpurush",sans-serif;line-height:1.8}
  .item-text.hi{font-family:"Noto Sans Devanagari","Mangal",sans-serif;line-height:1.8}
  .item-text.ur{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Alvi Nastaleeq","Noto Naskh Arabic",serif;line-height:2.3;font-size:1.2rem}
  .q{font-weight:650;margin:14px 0 6px}
  .emo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  @media (max-width:480px){.emo{grid-template-columns:repeat(2,1fr)}}
  .emo-btn{padding:10px 4px;border:2px solid var(--c);border-radius:8px;background:#fff;color:var(--c);font-weight:600}
  .emo-btn.sel{background:var(--c);color:#fff}
  .int{margin:10px 2px 2px}
  .slider{width:100%;height:34px;-webkit-appearance:none;appearance:none;margin:0;background:radial-gradient(circle at 13px 50%,#8892a6 7px,transparent 8px),radial-gradient(circle at 50% 50%,#8892a6 7px,transparent 8px),radial-gradient(circle at calc(100% - 13px) 50%,#8892a6 7px,transparent 8px)}
  .slider::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:#cfd6e4}
  .slider::-moz-range-track{height:6px;border-radius:99px;background:#cfd6e4}
  .slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);margin-top:-10px;border:3px solid #fff;box-shadow:0 0 0 1px var(--accent)}
  .slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--accent)}
  .slider.untouched::-webkit-slider-thumb{opacity:0} .slider.untouched::-moz-range-thumb{opacity:0}
  .ticks{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:.85rem;color:var(--mute)}
  .ticks span{cursor:pointer;padding:2px 0}
  .ticks span:nth-child(2){text-align:center}.ticks span:nth-child(3){text-align:right}
  .int-out{font-size:.9rem;color:var(--mute);margin-top:4px}
  .card{scroll-margin-top:12px}
  .navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
  ul{padding-left:1.2em} li{margin:.25em 0}
  .code{font:700 1.4rem/1.2 ui-monospace,Menlo,Consolas,monospace;background:#eef2fb;border-radius:8px;padding:10px 14px;display:inline-block}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ============================== CONFIG ============================== */
const CONFIG = {
  // Paste the Apps Script web-app URL (ends in /exec). While it is left as-is the page runs in
  // DEMO mode: everything works, but nothing is saved anywhere.
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzZFJfhdopJelcAsvpCnqwNeE35uiOUM2VpHtFEZAFKvdeowMYqdfP7hnkF-dSFuqj-/exec",
  PAGES: 3,
  ITEMS_PER_PAGE: 10,
  ATTENTION_AT: [],                 // e.g. [9, 24] adds 2 attention checks at those positions (they use up 2 of the 30 slots)
  CONTACT: "[18244910576@163.com]",    // shown on the consent screen
};
const REAL_PER_ANNOTATOR = CONFIG.PAGES * CONFIG.ITEMS_PER_PAGE - CONFIG.ATTENTION_AT.length; // 30

const EMOTIONS  = ["Joy","Fear","Anger","Sadness","Disgust","Shame","Guilt","Neutral"];
// Button colour per emotion: change the hex codes here to restyle.
const EMO_COLOR = {Joy:"#b7791f",Fear:"#6b4fb3",Anger:"#c0392b",Shame:"#c2578a",Guilt:"#8a6d3b",Disgust:"#4f8a3c",Sadness:"#2f6fb0",Neutral:"#5d6678"};
const INTENSITY = ["Low","Moderate","High"];

// Country + language -> study group. Anything else is shown the "not recruiting" screen.
const VARIANTS = {
  "BD-Bengali": { country:"Bangladesh", language:"Bengali", lang:"bn", cls:"bn", dir:"ltr", prefix:"BD" },
  "IN-Hindi":   { country:"India",      language:"Hindi",   lang:"hi", cls:"hi", dir:"ltr", prefix:"IN" },
  "PK-Urdu":    { country:"Pakistan",   language:"Urdu",    lang:"ur", cls:"ur", dir:"rtl", prefix:"PK" },
  // English version: open to people from the three countries; the country is part of their annotator code.
  "EN-English": { country:null,         language:"English", lang:"en", cls:"en", dir:"ltr", prefix:"EN" },
};
const COUNTRY_CODE = { Bangladesh:"BD", India:"IN", Pakistan:"PK" };
const OWN_LANG = "Bengali / Hindi / Urdu", ENGLISH = "English";

/* ============================== ITEMS ==============================
   PLACEHOLDER BANK for testing. Replace ITEMS with your real localized items, one array per group:
   ITEMS["BD-Bengali"] = [{id:"BD_FAM_01", setup:"...", dialogue:"..."}, ...]
   If a bank holds more than 38 items, each annotator gets 38 of them, balanced across categories and
   fixed by their code. */
const SEED = [
  {setup:"Your auntie has come to visit your home with her family without any notice. You serve them with tea and food that you have at home at the moment.",
   dialogue:"Your mother still has not learned to always arrange food for guests beforehand."},
  {setup:"You asked for a raise after two years without one.",
   dialogue:"Let's revisit this next quarter, the budget's tight right now."},
  {setup:"You left most of the rice on your plate at your grandmother's house.",
   dialogue:"You used to finish everything I made. Not hungry today?"},
  {setup:"You mentioned feeling overwhelmed with work to your mother, hoping for some support.",
   dialogue:"We all go through stress, you'll manage, you always do."},
];
function makeBank(variant){
  const out=[];
  for(let i=1;i<=REAL_PER_ANNOTATOR;i++){
    const s=SEED[i-1];
    out.push({id:`${variant}_${String(i).padStart(3,"0")}`,
      setup:s?s.setup:`[Placeholder setup ${i}]`, dialogue:s?s.dialogue:`[Placeholder dialogue ${i}]`});
  }
  return out;
}
const ITEMS = {}; Object.keys(VARIANTS).forEach(v=>ITEMS[v]=makeBank(v));
// The real items live in items.json (same folder as this page):
// {"BD-Bengali":[{"id":"BD_FAM_01","setup":"...","dialogue":"..."}], "IN-Hindi":[...], "PK-Urdu":[...]}
// The 2nd part of the id (FAM, SOC, ...) is the category, used to balance what each person sees.
let ITEMS_FROM_FILE=false;
async function loadItems(){
  try{ const r=await fetch("items.json",{cache:"no-store"});
    if(r.ok){const j=await r.json();
      Object.keys(VARIANTS).forEach(k=>{ if(Array.isArray(j[k])&&j[k].length) ITEMS[k]=j[k]; });
      ITEMS_FROM_FILE=Object.keys(VARIANTS).every(k=>Array.isArray(j[k])&&j[k].length);} }catch(e){}
}

function attentionItem(variant,n){
  return {id:`${variant}_ATT${n}`, attention:true,
    setup:"Attention check: this is not a real scenario.",
    dialogue:"Please choose Joy for the \"genuinely feel\" question and Neutral for the \"outwardly show\" question, and set both intensities to Low."};
}

/* ============================== HELPERS ============================== */
const $app=document.getElementById("app");
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") el.className=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(v===true) el.setAttribute(k,"");
    else if(v!==false&&v!=null) el.setAttribute(k,v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(k)); }
  return el;
}
function show(...nodes){ $app.replaceChildren(demoBanner(),...nodes.flat(Infinity)); window.scrollTo(0,0); }
const live=()=>/^https:\/\/script\.google\.com\//.test(CONFIG.APPS_SCRIPT_URL);
function demoBanner(){ return live()?document.createComment(""):h("div",{class:"demo"},"Demo mode: no backend URL is set, so responses are NOT being saved."); }

function hash(s){let x=1779033703^s.length;for(let i=0;i<s.length;i++){x=Math.imul(x^s.charCodeAt(i),3432918353);x=x<<13|x>>>19;}return x>>>0;}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newId(prefix){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const b=new Uint8Array(6); crypto.getRandomValues(b);
  return prefix+"-"+[...b].map(x=>chars[x%chars.length]).join("");
}

/* ============================== STATE ============================== */
const LS="emo_study_state_v1";
let state=null;
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}};
const load=()=>{try{return JSON.parse(localStorage.getItem(LS));}catch(e){return null;}};

async function post(payload){
  if(!live()){ console.log("DEMO payload",payload); return {ok:true,demo:true}; }
  let err;
  for(let t=0;t<3;t++){
    try{
      const res=await fetch(CONFIG.APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
      const j=await res.json(); if(j.ok) return j; err=new Error(j.error||"server error");
    }catch(e){err=e;}
    await new Promise(r=>setTimeout(r,800*(t+1)));
  }
  throw err;
}

/* ============================== SCREENS ============================== */
function start(){
  const s=load();
  if(s&&s.consented&&s.id&&!s.done){
    show(h("div",{class:"panel"},
      h("h1",null,"Welcome back"),
      h("p",null,`You have an unfinished session (code ${s.id}).`),
      h("div",{class:"row"},
        h("button",{class:"btn",onclick:()=>{state=s;state.saved=state.saved||{};goToFirstUnsaved();}},"Continue"),
        h("button",{class:"btn ghost",onclick:()=>{if(confirm("Start over with a new session? Answers you already saved stay saved.")){localStorage.removeItem(LS);showConsent();}}},"Start a new session"))));
  } else showConsent();
}

function goToFirstUnsaved(){
  const seq=buildSequence();
  const idx=seq.findIndex(it=>!state.saved[it.id]);
  if(idx<0){state.done=true;save();showDone();return;}
  state.page=Math.floor(idx/CONFIG.ITEMS_PER_PAGE)+1; save(); showPage();
}

/* 1. consent (with "continue with my code" for returning people) */
function showConsent(){
  const box=h("input",{type:"checkbox",id:"agree"});
  const err=h("div",{class:"err"});
  const codeBox=h("input",{type:"text",id:"resume",placeholder:"e.g. BD-K7M2QX",autocomplete:"off"});
  show(h("div",{class:"panel"},
    h("h1",null,"Instructions and consent"),
    h("h2",null,"What this study is about"),
    h("p",null,"We are studying how people from different cultures read emotion in everyday conversations. Your answers will help us test whether AI language models understand these differences."),
    h("h2",null,"What you will do"),
    h("p",null,`You will read ${CONFIG.PAGES*CONFIG.ITEMS_PER_PAGE} short situations, each with something that someone says to you. For each one, imagine it is said to you and answer two questions:`),
    h("ul",null,
      h("li",null,h("b",null,"What would you genuinely feel?"),"  (your inner emotion)"),
      h("li",null,h("b",null,"What would you outwardly show?"),"  (the emotion other people would see)")),
    h("p",null,"These can be the same or different. For each, pick one emotion and set how strong it is (Low, Moderate or High). There are no right or wrong answers; we want your honest first reaction. Your answers describe how you think you would react, which may differ from how you would feel in real life."),
    h("p",null,`It takes about 30 to 45 minutes: ${CONFIG.PAGES} pages of ${CONFIG.ITEMS_PER_PAGE} items. You can use "Save and exit" at any time and continue later with your code.`),
    h("h2",null,"Your rights"),
    h("ul",null,
      h("li",null,"Taking part is voluntary. You can stop at any time without giving a reason (use \"Save and exit\" to leave and, if you wish, return later)."),
      h("li",null,"Some situations touch on sensitive topics such as religion, relationships, family expectations and sexuality. If a situation makes you uncomfortable, you may stop at any time."),
      h("li",null,"We do not collect your name, email or IP address. You get a random code; your answers are linked only to that code."),
      h("li",null,"Answers are stored in a password-protected Google Sheet accessible only to the research team, and will be used for research and reported in aggregate."),
      h("li",null,`To withdraw your data later, send your code to ${CONFIG.CONTACT}. The data linked to that code will be deleted.`)),
    h("label",{style:"display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:16px"},box,
      h("span",null,"I am 18 or older, I have read the above, and I agree to take part.")),
    err,
    h("div",{class:"row"},h("button",{class:"btn",onclick:()=>{
      if(!box.checked){err.textContent="Please tick the box to agree.";return;}
      showIntake(new Date().toISOString());
    }},"Continue")),
    h("p",{class:"note"},"[Add your ethics approval number and institution here before launch.]"),
    h("h2",null,"Already started?"),
    h("p",{class:"note"},"Enter your code to continue where you left off."),
    codeBox,
    h("div",{class:"row"},h("button",{class:"btn ghost",onclick:async()=>{
      const id=codeBox.value.trim().toUpperCase(); if(!id) return;
      if(!live()){err.textContent="Resuming by code needs the backend; it is off in demo mode.";return;}
      try{
        const r=await (await fetch(`${CONFIG.APPS_SCRIPT_URL}?id=${encodeURIComponent(id)}`)).json();
        if(!r.found){err.textContent="Code not found.";return;}
        state={id,variant:r.variant,batch:Number(r.batch)||1,consented:true,page:1,answers:{},saved:{},done:false,demo:{}};
        (r.rows||[]).forEach(x=>{state.answers[x.item_id]={sup:x.sup,supInt:x.supInt,exp:x.exp,expInt:x.expInt};state.saved[x.item_id]=1;});
        goToFirstUnsaved();
      }catch(e){err.textContent="Could not reach the server. Check your connection and try again.";}
    }},"Continue with code"))));
}

function select(id,label,options,optional){
  return [h("label",{for:id},label,optional?h("span",{class:"opt"}," (optional)"):null),
    h("select",{id},h("option",{value:""},optional?"Prefer not to say":"Select…"),options.map(o=>h("option",{value:o},o)))];
}

/* 2. about you -> routes to the Hindi / Bengali / Urdu set, or to the English set; code is generated automatically */
function showIntake(consentedAt){
  const err=h("div",{class:"err"});
  const btn=h("button",{class:"btn",onclick:async()=>{
    const v=id=>document.getElementById(id).value;
    if(!v("country")||!v("language")||!v("age")||!v("survey_lang")){err.textContent="Please answer country, language, age and survey language.";return;}
    const english=v("survey_lang")===ENGLISH;
    if(english&&!v("english_level")){err.textContent="Please tell us how well you read English.";return;}
    const key=english
      ? (COUNTRY_CODE[v("country")]?"EN-English":null)
      : Object.keys(VARIANTS).find(k=>VARIANTS[k].country===v("country")&&VARIANTS[k].language===v("language"));
    if(!key||v("age")==="Under 18"){
      show(h("div",{class:"panel"},h("h1",null,"Thank you"),
        h("p",null,"This study is not currently recruiting participants in your group. We appreciate your interest.")));return;
    }
    const batch=Math.max(1,parseInt(new URLSearchParams(location.search).get("batch"),10)||1);
    const st={id:newId(english?"EN-"+COUNTRY_CODE[v("country")]:VARIANTS[key].prefix),variant:key,batch,consented:true,consentedAt,page:1,answers:{},saved:{},done:false,
      demo:{country:v("country"),language:v("language"),age_band:v("age"),gender:v("gender"),religion:v("religion"),
        survey_language:v("survey_lang"),english_level:english?v("english_level"):""}};
    btn.disabled=true;err.textContent="";
    try{
      await post({type:"annotator",annotator_id:st.id,variant:st.variant,batch:st.batch,...st.demo,
        consented_at:consentedAt,user_agent:navigator.userAgent});
      state=st;save();showPage();
    }catch(e){btn.disabled=false;err.textContent="Connection problem. Please try again.";}
  }},"Continue");
  show(h("div",{class:"panel"},
    h("h1",null,"About you"),
    h("p",null,"A few quick questions. They are used only to describe the group of participants. A random annotator code will be given to you on the next page."),
    select("country","Which country are you from?",["Bangladesh","India","Pakistan","Other"]),
    select("language","Which language do you speak at home?",["Bengali","Hindi","Urdu","Other"]),
    select("survey_lang","Which version of the survey do you want to answer?",[OWN_LANG,ENGLISH]),
    h("p",{class:"note"},"Choose English if you are comfortable reading English; the situations will then be shown in English. Otherwise choose the first option and the situations will be in your own language."),
    select("english_level","How well do you read English? (needed for the English version)",["Basic","Good","Fluent","Native"]),
    select("age","Your age",["Under 18","18–24","25–34","35–44","45–54","55+"]),
    select("gender","Gender",["Female","Male","Non-binary / other"],true),
    select("religion","Religion",["Islam","Hinduism","Christianity","Buddhism","Other religion","No religion"],true),
    err,h("div",{class:"row"},btn)));
}

/* ----- question pages ----- */
// Takes n items spread evenly over the categories (the 2nd part of each id), chosen by the annotator's code.
function pickSubset(bank,n,seed){
  if(bank.length<=n) return bank.slice();
  const r=rng(hash(seed)), groups={};
  bank.forEach(it=>{const c=it.id.split("_")[1]||"X";(groups[c]=groups[c]||[]).push(it);});
  const cats=Object.keys(groups), per=Math.floor(n/cats.length);
  const chosen=[], rest=[];
  cats.forEach(c=>{const g=shuffle(groups[c],r);chosen.push(...g.slice(0,per));rest.push(...g.slice(per));});
  chosen.push(...shuffle(rest,r).slice(0,n-chosen.length));
  return chosen;
}
function buildSequence(){
  const pool=pickSubset(ITEMS[state.variant],REAL_PER_ANNOTATOR,state.id+"|subset");
  const seq=shuffle(pool,rng(hash(state.id)));          // same items and order every time for this code
  CONFIG.ATTENTION_AT.forEach((pos,i)=>seq.splice(pos,0,attentionItem(state.variant,i+1)));
  return seq;
}
const orderFor=item=>rng(hash(state.id+item.id))()<0.5?"SE":"ES"; // S = suppressed first, E = expressed first

function emotionBlock(a,key,label){
  const grid=h("div",{class:"emo",role:"group","aria-label":label});
  EMOTIONS.forEach(e=>{
    const b=h("button",{type:"button",class:"emo-btn"+(a[key]===e?" sel":""),"aria-pressed":String(a[key]===e),
      onclick:ev=>{
        a[key]=e;
        [...grid.children].forEach(c=>{const on=c.dataset.v===e;c.classList.toggle("sel",on);c.setAttribute("aria-pressed",String(on));});
        ev.currentTarget.closest(".card").classList.remove("bad");save();
      }},e);
    b.dataset.v=e;b.style.setProperty("--c",EMO_COLOR[e]);grid.append(b);
  });
  return grid;
}
function intensityBlock(a,key){
  const cur=a[key];
  const input=h("input",{type:"range",min:1,max:3,step:1,value:cur?INTENSITY.indexOf(cur)+1:2,
    class:"slider"+(cur?"":" untouched"),"aria-label":"Intensity: low, moderate or high"});
  const out=h("div",{class:"int-out"},cur?`Selected: ${cur}`:"Tap or drag the slider to choose how strong");
  const set=()=>{input.classList.remove("untouched");const v=INTENSITY[+input.value-1];a[key]=v;out.textContent=`Selected: ${v}`;
    input.closest(".card").classList.remove("bad");save();};
  ["input","change","pointerup"].forEach(ev=>input.addEventListener(ev,set));
  const tick=(n,txt)=>h("span",{onclick:()=>{input.value=n;set();}},txt);
  return h("div",{class:"int"},input,h("div",{class:"ticks"},tick(1,"Low"),tick(2,"Moderate"),tick(3,"High")),out);
}
function judgement(a,item,which){
  const sup=which==="S";
  const q=sup?"How strong is the emotion you would genuinely feel?":"How strong is the emotion you would outwardly show?";
  return h("div",null,
    h("div",{class:"q"},sup?"If this were said to you, what would you genuinely feel?":"If this were said to you, what would you outwardly show?"),
    emotionBlock(a,sup?"sup":"exp",sup?"Genuinely feel":"Outwardly show"),
    h("div",{class:"q",style:"font-weight:500"},q),
    intensityBlock(a,sup?"supInt":"expInt"));
}
function renderCard(item,n){
  const V=VARIANTS[state.variant];
  const a=state.answers[item.id]||(state.answers[item.id]={});
  const txt=t=>h("div",{class:"item-text "+V.cls,lang:V.lang,dir:V.dir},t);
  const order=orderFor(item)==="SE"?["S","E"]:["E","S"];
  const blocks=h("div",{class:"blocks"},order.map(w=>judgement(a,item,w)));
  const card=h("section",{class:"card",id:"c-"+item.id},
    h("div",{class:"note"},`Item ${n}`),
    h("div",{class:"scene"},h("b",null,"Situation"),txt(item.setup)),
    h("div",{class:"scene"},h("b",null,"Said to you"),txt(item.dialogue)),
    blocks);
  return card;
}
const complete=a=>!!(a&&a.sup&&a.supInt&&a.exp&&a.expInt);

function rowFor(it){
  const a=state.answers[it.id];
  return {item_id:it.id,is_attention:!!it.attention,
    attention_pass:it.attention?(a.sup==="Joy"&&a.exp==="Neutral"&&a.supInt==="Low"&&a.expInt==="Low"):"",
    order_shown:orderFor(it),sup_emotion:a.sup,sup_intensity:a.supInt,
    exp_emotion:a.exp,exp_intensity:a.expInt};
}
async function sendRows(items,page,t0){
  const rows=items.map(rowFor);
  await post({type:"responses",annotator_id:state.id,variant:state.variant,page,
    page_seconds:Math.round((Date.now()-t0)/1000),rows});
  rows.forEach(r=>state.saved[r.item_id]=1);
}

const pageItems=(seq,pg)=>seq.slice((pg-1)*CONFIG.ITEMS_PER_PAGE,pg*CONFIG.ITEMS_PER_PAGE);

// Highlight unanswered items and scroll up to the first one.
function flagIncomplete(items){
  const bad=items.filter(it=>!complete(state.answers[it.id]));
  items.forEach(it=>{const el=document.getElementById("c-"+it.id); if(el) el.classList.toggle("bad",bad.includes(it));});
  if(bad.length) document.getElementById("c-"+bad[0].id).scrollIntoView({behavior:"smooth",block:"start"});
  return bad;
}
// Send every finished item on a page (the sheet overwrites earlier versions of the same item).
async function savePageItems(items,pg,t0){
  const ready=items.filter(it=>complete(state.answers[it.id]));
  if(ready.length) await sendRows(ready,pg,t0);
}

function showPage(highlight){
  state.saved=state.saved||{};
  const seq=buildSequence();
  const per=CONFIG.ITEMS_PER_PAGE, base=(state.page-1)*per;
  const items=pageItems(seq,state.page);
  const t0=Date.now();
  const err=h("div",{class:"err"});
  const first=state.page===1, last=state.page===CONFIG.PAGES;
  const all=[];                                   // every button, so they can be disabled while saving
  const mk=(cls,label,fn)=>{const b=h("button",{class:cls,onclick:async()=>{
      err.textContent="";all.forEach(x=>x.disabled=true);
      try{await fn();}catch(e){all.forEach(x=>x.disabled=false);
        err.textContent="Could not save (connection problem). Your answers are still here. Please try again.";}
    }},label);all.push(b);return b;};
  const goto=async pg=>{ try{await savePageItems(items,state.page,t0);}catch(e){}   // best-effort save when moving around
    state.page=pg;save();showPage(); };

  const backBtn=first?h("span"):mk("btn ghost","← Back",()=>goto(state.page-1));
  const fwdBtn=last?h("span"):mk("btn ghost","Forward →",()=>goto(state.page+1));

  const exitBtn=mk("btn ghost","Save and exit",async()=>{
    await savePageItems(items,state.page,t0);save();showSaved();});

  const mainBtn=last
    ? mk("btn","Submit",async()=>{
        // check EVERY page; if something is missing anywhere, jump to it
        const miss=seq.findIndex(it=>!complete(state.answers[it.id]));
        if(miss>=0){
          const pg=Math.floor(miss/per)+1;
          if(pg!==state.page){ try{await savePageItems(items,state.page,t0);}catch(e){} state.page=pg;save();showPage(true); }
          else{ const bad=flagIncomplete(items); err.textContent=`Please answer the highlighted item${bad.length>1?"s":""} (${bad.length} left) before submitting.`; all.forEach(x=>x.disabled=false); }
          return;
        }
        for(let pg=1;pg<=CONFIG.PAGES;pg++) await savePageItems(pageItems(seq,pg),pg,t0);
        state.done=true;save();showDone();})
    : mk("btn","Save and continue",async()=>{
        const bad=flagIncomplete(items);
        if(bad.length){err.textContent=`Please answer the highlighted item${bad.length>1?"s":""} (${bad.length} left). Or use "Save and exit" to finish later.`;all.forEach(x=>x.disabled=false);return;}
        await savePageItems(items,state.page,t0);
        state.page+=1;save();showPage();});

  show(
    h("div",{class:"note"},`Page ${state.page} of ${CONFIG.PAGES}   ·   your code: ${state.id}`),
    h("div",{class:"bar"},h("i",{style:`width:${((state.page-1)/CONFIG.PAGES)*100}%`})),
    items.map((it,i)=>renderCard(it,base+i+1)),
    err,
    h("div",{class:"navrow"},backBtn,fwdBtn),
    h("div",{class:"row"},exitBtn,mainBtn));
  if(highlight){ const bad=flagIncomplete(items); if(bad.length) err.textContent=`This page still has ${bad.length} unanswered item${bad.length>1?"s":""}. Please answer ${bad.length>1?"them":"it"}, then press Submit.`; }
}

function showSaved(){
  show(h("div",{class:"panel"},h("h1",null,"Progress saved"),
    h("p",null,"Your answers so far are saved. To continue later, open this link again and enter your code on the first page:"),
    h("p",null,h("span",{class:"code"},state.id)),
    h("p",{class:"note"},"Write the code down. Anyone with the code can continue this session."),
    h("div",{class:"row"},h("button",{class:"btn",onclick:()=>goToFirstUnsaved()},"Keep going now"))));
}

function showDone(){
  show(h("div",{class:"panel"},h("h1",null,"Thank you!"),
    h("p",null,"All your answers have been saved. This is your completion code:"),
    h("p",null,h("span",{class:"code"},state.id)),
    h("p",{class:"note"},`Keep it if you need to claim payment or ask for your data to be deleted (${CONFIG.CONTACT}).`)));
}

loadItems().then(()=>{
  if(live()&&!ITEMS_FROM_FILE){
    show(h("div",{class:"panel"},h("h1",null,"Could not load the study"),
      h("p",null,"The study items could not be loaded. Please check your connection and refresh this page.")));
  } else start();
});
</script>
</body>
